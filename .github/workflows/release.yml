name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # aapt2 用的是 ARM 构建，必须在 aarch64 主机上打
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17 与基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless unzip zip xz-utils file
          java -version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 npm 依赖
        run: npm install --no-audit --no-fund

      - name: 拉取官方组件（VS Code 服务端 / CLI / rootfs / proot / arm64 aapt2）
        run: bash scripts/fetch-assets.sh 8

      - name: 恢复签名密钥（可选）
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p build
            printf '%s' "$KS" | base64 -d > build/vscode.jks
            echo "已使用仓库提供的签名密钥"
          else
            echo "未提供 KEYSTORE_BASE64，本次将临时生成签名密钥"
          fi

      - name: 构建 APK
        run: |
          VCODE="${{ github.run_number }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VNAME="${GITHUB_REF_NAME#v}"
          else
            VNAME="0.0.$VCODE"
          fi
          echo "versionCode=$VCODE versionName=$VNAME"
          VCODE="$VCODE" VNAME="$VNAME" bash build.sh

      - name: 校验产物
        run: |
          ls -lh build/vscode.apk
          dl/sdktools/build-tools/aapt2 dump badging build/vscode.apk | head -3
          # 发布产物里绝不允许出现密钥
          if grep -aqE "sk-[A-Za-z0-9]{20,}" build/vscode.apk; then
            echo "::error::APK 里发现疑似 API key，终止发布"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: build/vscode.apk
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
