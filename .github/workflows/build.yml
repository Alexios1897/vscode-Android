name: build-apk

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # fetch-assets.sh 会按 uname -m 自动挑 aapt2/zipalign，所以 x86_64 runner 也能出 arm64 的包
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils unzip xz-utils

      - name: 缓存官方组件
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-assets.sh') }}
          restore-keys: |
            dl-${{ runner.os }}-${{ runner.arch }}-

      - name: 拉取官方组件
        run: bash scripts/fetch-assets.sh

      - name: 构建 APK
        env:
          VCODE: ${{ github.run_number }}
          VNAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '2.6' }}
        run: bash build.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: vscode-apk
          path: build/vscode.apk
          if-no-files-found: error
